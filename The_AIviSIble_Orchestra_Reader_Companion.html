<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The AIviSIble Orchestra · Reader Companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEE6DB; --paper-2:#F6F1EA; --card:#FBF8F3; --ink:#24201B; --ink-2:#5B544B; --rule:#D6CCBE;
  --saffron:#F88A26; --gold:#B5884A; --navy:#12294F; --orange:#EB703D; --good:#2F7D4F; --bad:#B23A2E;
  --tile-hit:#2F7D4F; --tile-near:#C98A1E; --tile-miss:#8D857A;
  --display:'Bodoni Moda', 'Didot', 'Bodoni 72', Georgia, serif;
  --sans:'Source Sans 3', 'Source Sans Pro', 'Segoe UI', system-ui, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1B1915; --paper-2:#22201B; --card:#2A2721; --ink:#EFE8DD; --ink-2:#B9B0A3; --rule:#3E3930;
    --navy:#9DB6E0; --gold:#D3A866; --orange:#F2884F; --saffron:#FFA14D; --tile-miss:#5E584F;
  }
}
:root[data-theme="dark"]{
  --paper:#1B1915; --paper-2:#22201B; --card:#2A2721; --ink:#EFE8DD; --ink-2:#B9B0A3; --rule:#3E3930;
  --navy:#9DB6E0; --gold:#D3A866; --orange:#F2884F; --saffron:#FFA14D; --tile-miss:#5E584F;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px)}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:18px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--navy);text-underline-offset:3px}
a:hover{color:var(--orange)}
:focus-visible{outline:3px solid var(--saffron);outline-offset:2px;border-radius:4px}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.narrow{max-width:760px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--rule)}
.top .wrap{display:flex;align-items:center;gap:20px;height:64px}
.mark{font-family:var(--display);font-size:22px;font-weight:500;text-decoration:none;color:var(--ink);white-space:nowrap}
.mark .ai{color:var(--gold)}
nav.main{display:flex;gap:4px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
nav.main::-webkit-scrollbar{display:none}
nav.main a{padding:8px 12px;border-radius:999px;text-decoration:none;color:var(--ink-2);font-weight:600;font-size:16px;white-space:nowrap}
nav.main a[aria-current="page"]{background:var(--navy);color:var(--paper)}
nav.main a:hover{color:var(--ink)}
nav.main a[aria-current="page"]:hover{color:var(--paper)}
.theme-btn{border:1px solid var(--rule);background:transparent;border-radius:999px;width:38px;height:38px;flex:none}
@media (max-width:760px){
  .top .wrap{height:auto;flex-wrap:wrap;padding-top:10px;padding-bottom:6px;gap:8px}
  nav.main{order:3;width:100%;margin-left:0}
  .theme-btn{margin-left:auto}
}

/* type */
h1,h2,h3{font-family:var(--display);font-weight:500;line-height:1.08;margin:0}
h1{font-size:clamp(44px,7vw,92px);letter-spacing:-.01em}
h2{font-size:clamp(32px,4.2vw,52px)}
h3{font-size:26px}
.lede{font-size:21px;color:var(--ink-2);max-width:640px}
.page-head{padding:56px 0 28px}
.page-head p{margin:14px 0 0}
section{padding:40px 0}
.kicker{color:var(--orange);font-weight:600;font-size:16px;margin:0 0 10px}

/* hero */
.hero{padding-top:48px}
h2[tabindex]:focus{outline:none}
.terms dt .tn{display:inline}
.tag{flex:none}
.hero h1 .ai{color:var(--gold);font-style:italic}
.hero .sub{font-size:22px;color:var(--ink-2);max-width:620px;margin:20px 0 0}
.score-wrap{margin-top:24px;position:relative}
.score{width:100%;height:auto;overflow:visible}
.score .staff line{stroke:var(--rule);stroke-width:1}
.score .curve{fill:none;stroke:var(--gold);stroke-width:1.6;stroke-linecap:round}
.score .curve.alt{stroke:var(--saffron);stroke-width:2.2}
.score .dot{fill:var(--gold)}
.score .dot.big{fill:var(--saffron)}
.score a text{font-family:var(--sans);font-size:15px;font-weight:600;fill:var(--ink-2);letter-spacing:.02em}
.score a:hover text,.score a:focus text{fill:var(--orange)}
.score a:focus{outline:none}
.draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 2.4s cubic-bezier(.5,0,.2,1) forwards}
.dot{opacity:0;animation:pop .5s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{to{opacity:1}}
@media (prefers-reduced-motion: reduce){.draw{animation:none;stroke-dashoffset:0}.dot{animation:none;opacity:1}}
.score-hint{font-size:15px;color:var(--ink-2);margin:6px 0 0}
.score-chips{display:none;margin-top:8px}
@media (max-width:640px){.score a{display:none}.score{margin-right:-24px}.score-chips{display:block}.grid5{width:min(100%,290px)}.tile{font-size:28px}}

/* routes */
.routes{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:2px solid var(--ink);margin-top:32px}
.route{padding:28px 28px 32px 0;text-decoration:none;color:var(--ink);border-right:1px solid var(--rule)}
.route+.route{padding-left:28px}
.route:last-child{border-right:0}
.route h3{font-size:32px;margin-bottom:8px}
.route p{margin:0;color:var(--ink-2)}
.route:hover h3{color:var(--orange)}
@media (max-width:760px){.routes{grid-template-columns:1fr}.route,.route+.route{padding:22px 0;border-right:0;border-bottom:1px solid var(--rule)}}

.quote-band{background:var(--navy);color:var(--paper);padding:56px 0;margin:48px 0 0}
.quote-band blockquote{margin:0;font-family:var(--display);font-size:clamp(28px,3.8vw,46px);line-height:1.15;max-width:900px}
.quote-band .src{margin-top:18px;opacity:.75;font-size:16px}
:root[data-theme="dark"] .quote-band, .quote-band{}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .quote-band{background:#14223A;color:#EFE8DD}}
:root[data-theme="dark"] .quote-band{background:#14223A;color:#EFE8DD}

.book{display:grid;grid-template-columns:300px 1fr;gap:48px;align-items:start}
.book img{border-radius:4px;box-shadow:0 18px 40px -18px rgba(36,32,27,.45)}
.sections-list{list-style:none;padding:0;margin:20px 0 0;counter-reset:s}
.sections-list li{padding:14px 0;border-top:1px solid var(--rule);display:grid;grid-template-columns:56px 1fr;gap:12px}
.sections-list li b{font-family:var(--display);font-size:24px;font-weight:500;color:var(--orange)}
.sections-list li span{display:block}
.sections-list li small{color:var(--ink-2);font-size:16px}
@media (max-width:760px){.book{grid-template-columns:1fr}.book img{max-width:240px}}

/* concepts */
.concepts{display:grid;grid-template-columns:280px 1fr;gap:48px;padding-bottom:64px}
.c-index{position:sticky;top:96px;align-self:start;max-height:calc(100vh - 120px);overflow:auto;padding-right:8px}
.c-group{margin:0 0 18px}
.c-group h4{margin:0 0 6px;font-size:15px;color:var(--orange);font-weight:600}
.c-group a{display:block;padding:5px 10px;margin-left:-10px;border-radius:6px;text-decoration:none;color:var(--ink-2);font-size:16px;line-height:1.3}
.c-group a[aria-current="true"]{background:var(--card);color:var(--ink);font-weight:600;box-shadow:inset 3px 0 0 var(--saffron)}
.c-detail h2{margin-bottom:16px}
.c-line{font-family:var(--display);font-size:26px;line-height:1.25;color:var(--navy);margin:0 0 24px;font-style:italic}
.c-body p{margin:0 0 16px;max-width:68ch}
.c-parts{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin:24px 0}
.c-part{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:14px 16px}
.c-part b{display:block;font-size:17px}
.c-part span{font-size:15px;color:var(--ink-2);line-height:1.4;display:block;margin-top:4px}
.ask{border-left:3px solid var(--saffron);padding:6px 0 6px 18px;margin:28px 0;max-width:62ch}
.ask small{display:block;color:var(--orange);font-weight:600;font-size:15px}
.c-nav{display:flex;justify-content:space-between;gap:16px;margin-top:40px;padding-top:20px;border-top:1px solid var(--rule)}
.c-nav a{text-decoration:none;font-weight:600}
.pill-link{display:inline-block;margin:4px 6px 0 0;padding:4px 12px;border-radius:999px;border:1px solid var(--rule);text-decoration:none;font-size:15px;color:var(--ink-2)}
.pill-link:hover{border-color:var(--orange);color:var(--orange)}
@media (max-width:900px){
  .concepts{grid-template-columns:1fr;gap:20px}
  .c-index{position:static;max-height:none;display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
  .c-group{display:contents}
  .c-group h4{display:none}
  .c-group a{white-space:nowrap;margin:0;border:1px solid var(--rule)}
}

/* decoder */
.search{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:8px 0 18px}
.search input{flex:1 1 320px;font:inherit;font-size:20px;padding:14px 18px;border-radius:12px;border:2px solid var(--ink);background:var(--card);color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:999px;padding:3px;background:var(--card)}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:999px;font-weight:600;font-size:15px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--navy);color:var(--paper)}
.btn{border:2px solid var(--ink);background:transparent;border-radius:999px;padding:9px 18px;font-weight:600;font-size:16px}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn.primary{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.primary:hover{background:var(--ink);border-color:var(--ink)}
.az{display:flex;flex-wrap:wrap;gap:2px;margin-bottom:18px}
.az button{border:0;background:transparent;width:30px;height:30px;border-radius:6px;font-weight:600;font-size:15px;color:var(--ink-2)}
.az button[aria-pressed="true"]{background:var(--saffron);color:#24201B}
.az button:disabled{opacity:.3;cursor:default}
.count{color:var(--ink-2);font-size:15px;margin:0 0 8px}
.terms{list-style:none;padding:0;margin:0;columns:2;column-gap:48px}
.terms li{break-inside:avoid;padding:16px 0;border-top:1px solid var(--rule)}
.terms li.flash{background:color-mix(in srgb,var(--saffron) 18%,transparent);border-radius:8px;padding-left:12px;padding-right:12px}
.terms dt{font-weight:700;font-size:19px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.tag{font-size:13px;font-weight:600;padding:2px 9px;border-radius:999px;border:1px solid var(--gold);color:var(--gold)}
.tag.book{background:var(--navy);border-color:var(--navy);color:var(--paper)}
.terms dd{margin:6px 0 0;color:var(--ink-2);font-size:17px}
.terms mark{background:color-mix(in srgb,var(--saffron) 35%,transparent);color:inherit;border-radius:2px}
.empty{padding:40px 0;color:var(--ink-2)}
@media (max-width:760px){.terms{columns:1}}

/* play hub */
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px;padding-bottom:56px}
.game{display:flex;flex-direction:column;gap:10px;padding:24px;border-radius:14px;background:var(--card);border:1px solid var(--rule);text-decoration:none;color:var(--ink);min-height:220px}
.game:hover{border-color:var(--ink)}
.game .glyph{font-family:var(--display);font-size:46px;line-height:1;color:var(--orange)}
.game h3{font-size:28px}
.game p{margin:0;color:var(--ink-2);font-size:16px}
.game .meta{margin-top:auto;font-size:14px;color:var(--gold);font-weight:600}
.back{display:inline-block;margin:28px 0 0;font-weight:600;text-decoration:none}

/* five notes */
.fn{display:grid;grid-template-columns:1fr 300px;gap:40px;align-items:start;padding-bottom:56px}
.grid5{display:grid;grid-template-rows:repeat(6,1fr);gap:8px;width:min(100%,360px)}
.row5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.row5.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.tile{aspect-ratio:1;display:grid;place-items:center;border:2px solid var(--rule);border-radius:8px;font-family:var(--display);font-size:34px;font-weight:700;text-transform:uppercase;background:var(--card)}
.tile.filled{border-color:var(--ink-2)}
.tile.hit{background:var(--tile-hit);border-color:var(--tile-hit);color:#fff}
.tile.near{background:var(--tile-near);border-color:var(--tile-near);color:#fff}
.tile.miss{background:var(--tile-miss);border-color:var(--tile-miss);color:#fff}
.kbd{margin-top:22px;display:flex;flex-direction:column;gap:6px;width:min(100%,520px)}
.kbd div{display:flex;gap:5px;justify-content:center}
.kbd button{flex:1;min-width:0;height:52px;border:0;border-radius:6px;background:var(--rule);font-weight:700;font-size:16px}
.kbd button.wide{flex:1.6;font-size:14px}
.kbd button.hit{background:var(--tile-hit);color:#fff}
.kbd button.near{background:var(--tile-near);color:#fff}
.kbd button.miss{background:var(--tile-miss);color:#fff}
.side-card{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:20px}
.side-card h4{margin:0 0 8px;font-size:17px}
.side-card p{margin:0 0 10px;font-size:16px;color:var(--ink-2)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;margin:12px 0}
.stats b{display:block;font-family:var(--display);font-size:32px;font-weight:500}
.stats span{font-size:13px;color:var(--ink-2)}
.msg{min-height:28px;font-weight:600;margin:12px 0 0}
.result-card{border-top:2px solid var(--ink);margin-top:18px;padding-top:14px}
@media (max-width:860px){.fn{grid-template-columns:1fr}}

/* deal drop */
.dd{display:grid;grid-template-columns:1fr 260px;gap:40px;padding-bottom:56px;align-items:start}
.clue{font-family:var(--display);font-size:26px;font-style:italic;color:var(--navy);margin:0 0 22px}
.phrase{display:flex;flex-wrap:wrap;gap:18px;margin-bottom:26px}
.word{display:flex;gap:5px}
.slot{width:36px;height:48px;border-bottom:3px solid var(--ink);display:grid;place-items:center;font-family:var(--display);font-size:30px;font-weight:700}
.slot.reveal{color:var(--bad)}
.letters{display:flex;flex-wrap:wrap;gap:6px;max-width:560px}
.letters button{width:42px;height:46px;border:1px solid var(--rule);border-radius:8px;background:var(--card);font-weight:700}
.letters button:disabled{opacity:.35}
.letters button.ok{background:var(--tile-hit);color:#fff;border-color:var(--tile-hit);opacity:1}
.pipe{list-style:none;padding:0;margin:0;position:relative}
.pipe li{padding:10px 14px 10px 36px;border-left:2px solid var(--rule);position:relative;color:var(--ink-2);font-size:16px}
.pipe li::before{content:"";position:absolute;left:-7px;top:16px;width:12px;height:12px;border-radius:50%;background:var(--paper);border:2px solid var(--rule)}
.pipe li.here{color:var(--ink);font-weight:700}
.pipe li.here::before{background:var(--saffron);border-color:var(--saffron);box-shadow:0 0 0 5px color-mix(in srgb,var(--saffron) 25%,transparent)}
.pipe li.lost{color:var(--bad)}
.pipe li.lost::before{background:var(--bad);border-color:var(--bad)}
@media (max-width:860px){.dd{grid-template-columns:1fr}}

/* match */
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:820px}
.mcard{aspect-ratio:4/3;border-radius:12px;border:0;padding:0;perspective:800px;background:transparent}
.mcard .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.mcard.up .in,.mcard.done .in{transform:rotateY(180deg)}
.mcard .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;display:grid;place-items:center;padding:10px;text-align:center}
.mcard .front{background:var(--navy);color:var(--gold);font-family:var(--display);font-size:34px}
.mcard .backf{background:var(--card);border:1px solid var(--rule);transform:rotateY(180deg);font-size:15px;line-height:1.3}
.mcard .backf.term{font-weight:700;font-size:17px;color:var(--navy)}
.mcard.done .backf{border:2px solid var(--tile-hit)}
@media (prefers-reduced-motion: reduce){.mcard .in{transition:none}}
@media (max-width:640px){.mgrid{grid-template-columns:repeat(3,1fr)}.mcard .backf{font-size:13px}}

/* quiz */
.quiz{max-width:760px;padding-bottom:56px}
.qprog{height:4px;background:var(--rule);border-radius:4px;margin:0 0 28px;overflow:hidden}
.qprog i{display:block;height:100%;background:var(--saffron);transition:width .3s}
.qopts{display:grid;gap:10px;margin-top:20px}
.qopts button{text-align:left;padding:16px 20px;border-radius:12px;border:1px solid var(--rule);background:var(--card);font-size:18px}
.qopts button:hover{border-color:var(--ink)}
.archetype{font-family:var(--display);font-size:clamp(40px,6vw,68px);color:var(--orange);margin:6px 0 14px;line-height:1}
.bars{margin:24px 0}
.bar{display:grid;grid-template-columns:170px 1fr 30px;gap:12px;align-items:center;margin:8px 0;font-size:15px}
.bar i{display:block;height:10px;border-radius:5px;background:var(--gold)}
.bar.top i{background:var(--orange)}

/* scramble */
.scr{max-width:720px;padding-bottom:56px}
.scr-word{font-family:var(--display);font-size:clamp(44px,8vw,80px);letter-spacing:.12em;margin:10px 0}
.scr input{font:inherit;font-size:24px;padding:12px 16px;border-radius:12px;border:2px solid var(--ink);background:var(--card);color:var(--ink);width:100%;max-width:440px;text-transform:uppercase}
.timer{font-family:var(--display);font-size:44px}
.scr-top{display:flex;gap:32px;align-items:baseline}

/* tools */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 28px}
.tabs a{padding:9px 16px;border-radius:999px;border:1px solid var(--rule);text-decoration:none;font-weight:600;color:var(--ink-2)}
.tabs a[aria-current="page"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tool{display:grid;grid-template-columns:1fr 1fr;gap:36px;padding-bottom:56px;align-items:start}
.tool textarea,.tool input[type=text]{width:100%;font:inherit;font-size:17px;padding:14px 16px;border-radius:12px;border:1px solid var(--ink-2);background:var(--card);color:var(--ink)}
.tool textarea{min-height:240px;resize:vertical}
.tool label{display:block;font-weight:600;margin:14px 0 6px}
.tool label small{font-weight:400;color:var(--ink-2)}
.meter{height:16px;border-radius:8px;background:var(--rule);overflow:hidden;margin:10px 0}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--bad),var(--saffron),var(--good));transition:width .3s}
.marked{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:16px;font-size:16px;line-height:1.6;max-height:320px;overflow:auto;white-space:pre-wrap}
.marked .bz{background:color-mix(in srgb,var(--orange) 30%,transparent);border-radius:3px;padding:0 2px}
.marked .pf{background:color-mix(in srgb,var(--navy) 22%,transparent);border-radius:3px;padding:0 2px}
.big-num{font-family:var(--display);font-size:64px;line-height:1}
.note{background:var(--card);border:1px solid var(--rule);border-radius:4px;padding:32px;box-shadow:0 12px 30px -20px rgba(0,0,0,.4)}
.note h3{font-size:30px;margin-bottom:4px}
.note .dt{color:var(--ink-2);font-size:15px;margin-bottom:18px}
.note h5{margin:16px 0 4px;font-size:15px;color:var(--orange)}
.note p{margin:0;white-space:pre-wrap}
.slider{display:grid;grid-template-columns:120px 1fr 28px;gap:12px;align-items:center;margin:12px 0}
.slider input{width:100%;accent-color:var(--orange)}
.slider b{font-family:var(--display);font-size:22px;font-weight:500}
.force-bars .bar{grid-template-columns:110px 1fr 30px}
.force-bars .bar.weak i{background:var(--bad)}
@media (max-width:860px){.tool{grid-template-columns:1fr}}

/* authors */
.authors{display:grid;grid-template-columns:repeat(2,1fr);gap:40px;margin:24px 0}
.author figure{margin:0}
.author img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;filter:saturate(.92)}
.author figcaption{margin-top:14px}
.author h3{font-size:34px}

.gx-lessons span{color:var(--ink-2)}
.gx-chat{display:flex;flex-direction:column;gap:14px;min-width:0}
.gx-log{background:var(--card);border:1px solid var(--rule);border-radius:3px;padding:20px;min-height:360px;max-height:58vh;overflow:auto;display:flex;flex-direction:column;gap:14px}
.gmsg{max-width:86%;padding:12px 16px;border-radius:10px;font-size:17px;line-height:1.5}
.gmsg p{margin:0 0 8px}.gmsg p:last-child{margin-bottom:0}
.gmsg ul{margin:4px 0 8px;padding-left:20px}
.gmsg.g{background:var(--card-2);align-self:flex-start;border-top-left-radius:2px}
.gmsg.u{background:var(--orange);color:#fff;align-self:flex-end;border-top-right-radius:2px}
.gmsg .who{font-weight:700;font-size:13px;color:var(--orange-ink);margin-bottom:4px}
.gx-rel{font-size:15px;margin-top:8px!important;padding-top:8px;border-top:1px solid color-mix(in srgb,var(--ink) 15%,transparent)}
.gx-think{color:var(--ink-2)}
.gx-think span{animation:blink 1.2s infinite both}
.gx-think span:nth-child(2){animation-delay:.2s}.gx-think span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
@media (prefers-reduced-motion: reduce){.gx-think span{animation:none}}
.gx-starters{display:flex;flex-wrap:wrap;gap:6px}
.gx-starters .pill-link{background:transparent;cursor:pointer;font:inherit;font-size:15px;color:var(--ink-2)}
.gx-form textarea{width:100%;font:inherit;font-size:17px;padding:14px 16px;border-radius:3px;border:1px solid var(--rule);background:var(--card);color:var(--ink);resize:vertical}
.gx-form textarea:focus{border-color:var(--orange);outline:none}
.gx-actions{display:flex;gap:10px;justify-content:flex-end;align-items:center;margin-top:10px;flex-wrap:wrap}
.gx-actions .cta{padding:12px 18px;font-size:18px;gap:36px}
.gx-actions .cta:disabled{opacity:.6;cursor:wait}
.gx-note{font-size:14px;color:var(--ink-2);margin:0}
@media (max-width:900px){.gx{grid-template-columns:1fr}.gx-side{position:static;order:2}.gx-art{width:160px}.gx-log{max-height:none}}

/* ===== Pre-book ===== */
.pb-hero{display:grid;grid-template-columns:1.1fr .9fr;gap:64px;align-items:center;padding:48px 0 24px}
.pb-hero h1{font-size:clamp(40px,4.6vw,64px)}
.pb-hero h1 .serif{margin-top:4px}
.pb-hero h1::after{content:"";display:block;width:96px;height:5px;background:var(--orange);margin-top:24px}
.pb-hero .lede{margin:22px 0 0}
.pb-stack{position:relative;justify-self:center;width:min(100%,330px);padding:0 18px 18px 0}
.pb-stack::before,.pb-stack::after{content:"";position:absolute;inset:18px 0 0 18px;background:#fff;border-radius:2px 5px 5px 2px;box-shadow:0 0 0 1px rgba(25,50,87,.08)}
.pb-stack::before{inset:9px 9px 9px 9px;z-index:0}
.pb-stack::after{z-index:-1;box-shadow:0 30px 50px -28px rgba(25,50,87,.45),0 0 0 1px rgba(25,50,87,.08)}
.pb-stack .cover{position:relative;z-index:1}
.pb-ribbon{position:absolute;z-index:2;right:-6px;top:56%;background:var(--orange);color:#fff;font-weight:700;font-size:15px;padding:8px 14px 8px 16px;border-radius:2px 0 0 2px;box-shadow:0 8px 16px -8px rgba(0,0,0,.4)}
.pb-hero .hero-ctas{margin-top:30px;padding:0}
@media (max-width:860px){.pb-hero{grid-template-columns:1fr;gap:36px}.pb-stack{width:min(100%,260px);order:-1}}

.addons{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:5px solid var(--orange);background:var(--card);border-left:1px solid var(--rule);border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);margin:36px 0 8px}
.addon{padding:24px 24px 26px;border-right:1px solid var(--rule)}
.addon:last-child{border-right:0}
.addon svg{width:52px;height:52px;display:block;margin-bottom:14px;background:#FCE9DF;border-radius:50%;padding:7px}
.addon b{display:block;font-size:19px;color:var(--navy);line-height:1.2}
.addon p{margin:6px 0 0;font-size:16px;color:var(--ink-2);line-height:1.45}
@media (max-width:900px){.addons{grid-template-columns:1fr 1fr}.addon:nth-child(2){border-right:0}.addon:nth-child(-n+2){border-bottom:1px solid var(--rule)}}
@media (max-width:520px){.addons{grid-template-columns:1fr}.addon{border-right:0;border-bottom:1px solid var(--rule)}.addon:last-child{border-bottom:0}}

.pb-head{max-width:760px;padding:72px 0 26px}
.pb-head p{color:var(--ink-2);margin:16px 0 0;font-size:19px}
.pb-peek{position:relative}
.peek-note{display:flex;justify-content:center;margin:-34px 0 0;position:relative;z-index:2}
.peek-note .cta{box-shadow:0 14px 26px -14px rgba(237,112,61,.8)}

/* framework dial */
.fw{display:grid;grid-template-columns:minmax(0,520px) 1fr;gap:56px;align-items:center}
.dial{position:relative;width:min(100%,520px);aspect-ratio:1;justify-self:center}
.dial svg{position:absolute;inset:0;width:100%;height:100%}
.dial .ring{fill:none;stroke:var(--rule);stroke-width:1.5;stroke-dasharray:3 6}
.dial .spoke{stroke:var(--rule);stroke-width:1}
.dial .spoke.on{stroke:var(--orange);stroke-width:2}
.dial .loop{fill:none;stroke:var(--orange);stroke-width:3;stroke-linecap:round}
.dial .loopt{font-family:var(--sans);font-weight:700;font-size:14px;fill:var(--navy);text-anchor:middle}
.dial .core{fill:var(--band)}
.dial .coret{font-family:var(--sans);font-weight:700;font-size:18px;fill:#fff;text-anchor:middle}
.dial .cores{font-family:var(--sans);font-size:11px;fill:rgba(255,255,255,.75);text-anchor:middle}
.node{position:absolute;transform:translate(-50%,-50%);border:1.5px solid var(--navy);background:var(--card);color:var(--navy);border-radius:999px;padding:7px 14px;font-weight:700;font-size:15px;white-space:nowrap;line-height:1.1}
.node:hover{border-color:var(--orange);color:var(--orange-ink)}
.node[aria-pressed="true"]{background:var(--orange);border-color:var(--orange);color:#fff}
.fw-detail{border-left:5px solid var(--orange);padding:6px 0 6px 28px;min-height:280px}
.fw-detail .kicker{margin:0 0 6px}
.fw-detail h3{font-size:clamp(28px,3vw,38px);margin:0 0 12px}
.fw-detail .line{font-size:21px;color:var(--orange-ink);font-weight:600;margin:0 0 14px;line-height:1.35}
.fw-detail p.body{color:var(--ink-2);margin:0 0 20px;max-width:56ch}
@media (max-width:900px){.fw{grid-template-columns:1fr;gap:28px}.node{font-size:13px;padding:6px 10px}}

/* offers */
.tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;align-items:stretch}
.tier{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--rule);border-top:5px solid var(--navy);border-radius:3px;padding:30px 28px 28px}
.tier.feat{border-top-color:var(--orange);box-shadow:0 30px 50px -36px rgba(237,112,61,.7);position:relative}
.tier .flag{position:absolute;top:-17px;right:22px;background:var(--orange);color:#fff;font-weight:700;font-size:14px;padding:5px 12px;border-radius:3px}
.tier h3{font-size:26px;margin:0}
.tier .for{color:var(--ink-2);margin:6px 0 18px;font-size:16px}
.tier .price{font-size:46px;font-weight:800;color:var(--navy);line-height:1;letter-spacing:-.02em}
.tier .price small{display:block;font-size:14px;font-weight:400;color:var(--mute);letter-spacing:0;margin-top:6px}
.tier ul{list-style:none;padding:0;margin:22px 0 26px;border-top:1px solid var(--rule)}
.tier li{position:relative;padding:10px 0 10px 28px;border-bottom:1px solid var(--rule);font-size:16px;line-height:1.4}
.tier li::before{content:"";position:absolute;left:2px;top:17px;width:12px;height:5px;background:var(--orange)}
.tier li.plus{color:var(--ink-2)}
.tier .cta,.tier .btn{margin-top:auto;justify-content:space-between}
.tier .btn{padding:14px 20px;font-size:18px;display:inline-flex;align-items:center;gap:40px}
@media (max-width:960px){.tiers{grid-template-columns:1fr;max-width:520px}}

/* form */
.pb-form-wrap{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:start;padding-bottom:24px}
.pb-form{background:var(--card);border:1px solid var(--rule);border-top:5px solid var(--orange);border-radius:3px;padding:30px}
.pb-form label{display:block;font-weight:600;margin:16px 0 6px;color:var(--navy)}
.pb-form label:first-child{margin-top:0}
.pb-form label small{font-weight:400;color:var(--ink-2)}
.pb-form input,.pb-form select,.pb-form textarea{width:100%;font:inherit;font-size:17px;padding:12px 14px;border-radius:3px;border:1px solid var(--rule);background:var(--paper);color:var(--ink)}
.pb-form input:focus,.pb-form select:focus,.pb-form textarea:focus{border-color:var(--orange);outline:none}
.pb-form .row{display:grid;grid-template-columns:1fr 140px;gap:14px}
.pb-form .err{color:var(--bad);font-weight:600;font-size:15px;min-height:22px;margin:12px 0 0}
.pb-form .cta{width:100%;margin-top:6px}
.pb-sum{position:sticky;top:96px}
.pb-sum h3{font-size:28px;margin:0 0 10px}
.pb-sum .sum{border-top:2px solid var(--navy);margin-top:18px}
.pb-sum .sum div{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid var(--rule);font-size:17px}
.pb-sum .sum div b{color:var(--navy)}
.pb-sum .sum .tot{font-size:22px;font-weight:700;color:var(--navy);border-bottom:0}
.pb-ok{background:var(--card);border:1px solid var(--rule);border-top:5px solid var(--good);border-radius:3px;padding:30px}
.pb-ok h3{font-size:30px;margin:0 0 8px}
.pb-ok .code{display:inline-block;font-size:26px;font-weight:800;color:var(--orange-ink);letter-spacing:.04em;margin:8px 0 14px}
@media (max-width:900px){.pb-form-wrap{grid-template-columns:1fr}.pb-sum{position:static}.pb-form .row{grid-template-columns:1fr 110px}}

/* home pre-book band */
.pb-band{display:grid;grid-template-columns:170px minmax(0,1fr) auto;gap:44px;align-items:center;background:var(--card);border:1px solid var(--rule);border-left:6px solid var(--orange);border-radius:3px;padding:34px 40px;margin:56px 0 0}
.pb-band .cover{max-width:170px;transform:rotate(-4deg)}
.pb-band h2{font-size:clamp(28px,3vw,40px)}
.pb-band ul{list-style:none;padding:0;margin:16px 0 0;display:flex;flex-wrap:wrap;gap:8px 22px}
.pb-band li{position:relative;padding-left:22px;color:var(--ink-2);font-size:17px}
.pb-band li::before{content:"";position:absolute;left:0;top:12px;width:12px;height:5px;background:var(--orange)}
@media (max-width:900px){.pb-band{grid-template-columns:1fr;padding:28px 24px;gap:24px}.pb-band .cover{max-width:150px}}

/* ===== Mobile layer: phones and small tablets ===== */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
a,button,input,select,textarea,.node,.mcard{touch-action:manipulation}
a,button{-webkit-tap-highlight-color:transparent}
@media (hover:none){.scard:hover{transform:none}}

@media (max-width:760px){
  .top{-webkit-backdrop-filter:blur(8px)}
  /* menu: fade the right edge so hidden links read as "scroll for more" */
  nav.main{padding-right:28px;scroll-padding:0 28px;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 40px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 40px),transparent)}
  nav.main a{padding:10px 10px;font-size:15px}
  .runhead span:last-child{display:none}
  body{font-size:17px}
}

@media (max-width:640px){
  .wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  section{padding:28px 0}
  .page-head{padding:36px 0 20px}
  .shead{padding:44px 16px 18px}

  /* hero book spread */
  .spread-wrap{padding:12px 0 4px}
  .pg{padding:28px 22px 64px}
  .pg-l{min-height:0}
  .pg .rh{margin-bottom:22px}
  .title-block{margin:8px 0 24px}
  .folio{bottom:24px}
  .pg-l .folio{left:22px}.pg-r .folio{right:22px}
  .hero-ctas{flex-direction:column;align-items:stretch}
  .hero-ctas .btn{justify-content:center}

  /* score: the illustration is too small to read, the chips do the job */
  .score{display:none}
  .score-wrap{margin-top:8px}

  /* feature cards: two compact columns instead of five full screens */
  .strip{grid-template-columns:1fr 1fr;gap:10px;padding:4px 16px 16px}
  .scard{min-height:0;padding:18px 10px 20px;gap:4px}
  .scard:last-child:nth-child(odd){grid-column:1/-1}
  .scard .ic,.scard .ic svg{width:72px;height:72px}
  .scard .ic::before{left:13px;top:10px;width:50px;height:50px}
  .scard s{font-size:13px;margin-top:8px}
  .scard b{font-size:18px}

  /* Five Notes promo panel */
  .panel{margin:32px 12px}
  .panel-main{padding:32px 20px;gap:28px}
  .panel-foot{padding:18px 20px}
  .mini div{grid-template-columns:repeat(5,42px)}
  .mini i{height:42px;font-size:19px}

  .book .cover{margin:0 auto}
  .final{padding:56px 20px;margin-top:40px}
  .final .cta,.final .btn{display:flex;width:100%;max-width:340px;margin:10px auto 0}
  .final .btn{justify-content:center}

  /* Five Notes game */
  .grid5{width:min(100%,300px);margin:0 auto;gap:6px}
  .row5{gap:6px}
  .kbd{margin-top:18px;width:100%}
  .kbd div{gap:4px}
  .kbd button{height:50px;padding:0;font-size:15px}
  .kbd button.wide{flex:1.5;font-size:12px}
  .fn,.dd{gap:28px}

  /* Deal Drop */
  .clue{font-size:22px}
  .phrase{gap:14px 16px}
  .word{gap:3px}
  .slot{width:28px;height:40px;font-size:24px}
  .letters{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;max-width:none}
  .letters button{width:auto;height:46px}

  /* Decoder */
  .search input{flex-basis:100%;font-size:18px}
  .az{gap:4px}
  .az button{width:36px;height:36px}

  /* quiz, tools, notes */
  .qopts button{padding:14px 16px;font-size:17px}
  .bar{grid-template-columns:110px 1fr 26px;gap:10px}
  .slider{grid-template-columns:104px 1fr 24px;gap:10px}
  .note{padding:22px 18px}
  .big-num{font-size:52px}
  .scr-top{gap:20px}

  /* Ask Ganesha */
  .gx-log{min-height:280px;padding:14px}
  .gmsg{max-width:92%;font-size:16px}
  .gx-actions .cta{flex:1;justify-content:space-between}

  /* Pre-book */
  .pb-hero{padding:28px 0 12px}
  .pb-head{padding:48px 0 18px}
  .tier{padding:26px 20px 22px}
  .tier .price{font-size:40px}
  .pb-form,.pb-ok{padding:22px 18px}
  .fw-detail{padding-left:18px;min-height:0}
  .node{font-size:12px;padding:5px 8px}
  .peek-note{margin-top:-28px}
  .pb-band{padding:24px 18px;margin-top:40px}
  footer{padding:24px 0 36px;margin-top:28px}
}

@media (max-width:380px){
  h1{font-size:38px}
  h2{font-size:30px}
  .tb-title{font-size:46px}
  .pb-hero h1{font-size:36px}
  .pg .sec-title{font-size:40px}
  .pg .sec-no{font-size:28px}
  .scard b{font-size:16px}
  .kbd button{height:46px;font-size:14px}
  .kbd button.wide{font-size:11px}
  .slot{width:24px;height:36px;font-size:20px}
  .letters{grid-template-columns:repeat(6,minmax(0,1fr))}
  .mini div{grid-template-columns:repeat(5,36px)}
  .mini i{height:36px;font-size:16px}
  .az button{width:32px;height:32px}
}

 "Deals don’t move on dopamine. They move on due diligence.",
 "Growth rarely stalls everywhere. Find the weakest force before adding more activity.",
 "Brand creates memory. Opportunity creates movement. Trust makes both durable.",
 "There’s no best CMO. There’s only the CMO the business needs next.",

const CONCEPTS = [
 {id:"trifecta",g:0,t:"Brand. Demand. Experience.",line:"Three disciplines that only compound when they run as one loop.",
  body:["Brands build trust, trust fuels demand, demand delivers experiences, and great experiences feed back into the brand. Everyone knows the loop. The book’s point is what makes it hard in B2B.","Purchase isn’t a swipe; it’s a committee decision. Scarcity gimmicks don’t move anyone. You win when you make sense, continually, across channels, with authenticity. That means making sense to the CTO worried about integration debt, the CFO de-risking the future and the COO scanning for friction."],
  parts:[["Brand","What the market remembers about you when you aren’t in the room."],["Demand","Turning that memory into movement inside real accounts."],["Experience","Delivering on the promise, so the next deal starts closer to yes."]],
  ask:"Which of the three is your weakest link right now, and what evidence tells you so?",terms:["Market Memory","Experience Debt","Buying committee"]},
 {id:"orchestra",g:0,t:"The Invisible Orchestra",line:"The players who shape your deals when you’re not in the room.",
  body:["The Invisible Orchestra is the coordinated system of brand, demand, experience, intelligence, ecosystem influence and human judgment that shapes B2B growth.","Analysts, partners and narratives are the instruments buyers hear long before they hear you. Partners lend borrowed trust. Analysts act as market infrastructure. Narratives travel ahead of your sales team. Marketing’s job is to conduct, not to play every instrument."],
  parts:[["Analysts","Market infrastructure: they shape shortlists you never see."],["Partners","Borrowed trust, shared proof and access you can’t buy alone."],["Narratives","The story that arrives before your salesperson does."]],
  ask:"Which instrument in your orchestra is out of tune, and who in your company owns it?",terms:["Analyst relations","Partner ecosystem","Borrowed trust"]},
 {id:"mml",g:0,t:"Meaning, Momentum and Legacy",line:"From mindshare, to wallet share, to lasting market influence.",
  body:["The book frames B2B growth as a progression. Meaning is market understanding and mindshare. Momentum is commercial movement and wallet share. Legacy is a durable position and influence over the market itself.","Memory and relevance create Meaning. Proof and consensus create Momentum. Experience and learning decide whether that momentum compounds into Legacy."],
  parts:[["Meaning","Do the right buyers understand and remember us?"],["Momentum","Are accounts moving and spending more?"],["Legacy","Do we shape how the market thinks?"]],
  ask:"Is your company stuck between two of these stages? Which bridge is missing?",terms:["Wallet share","Market Memory"]},
 {id:"physics",g:1,t:"B2B Growth Physics",line:"Growth isn’t a funnel. It’s a field of six forces.",
  body:["Enterprise growth rarely behaves like gravity pulling everyone down the same path. Some forces pull the buyer closer; others create resistance. The book names six: Memory, Relevance, Proof, Consensus, Experience and Learning, with Coherence acting across all of them.","The diagnostic is written as a product on purpose: a severe weakness in one force can constrain the whole system. It’s a management metaphor, not an econometric equation. If awareness is high but consideration weak, don’t buy more media; ask whether Relevance or Proof is failing."],
  parts:[["Memory","Will the right buyer remember us when the moment comes?"],["Relevance","Do we understand what matters in this account, now?"],["Proof","Can our claims survive scrutiny?"],["Consensus","Can the buyer network defend one decision together?"],["Experience","Does reality confirm the promise?"],["Learning","Does every interaction make the system smarter?"]],
  ask:"Which single force is limiting your growth right now? Try the Growth Physics check in Tools.",link:["#/tools/physics","Run the Growth Physics check"],terms:["B2B Growth Physics","Coherence"]},
 {id:"memory",g:1,t:"Market Memory and the 95%",line:"Most buyers aren’t buying today. Be the brand they remember when they are.",
  body:["Market Memory is the set of associations that makes a brand come to mind when a relevant buying trigger appears. Research from the Ehrenberg-Bass Institute suggests that at any moment as many as 95% of potential B2B buyers aren’t in the market at all.","So demand can’t be built only around the 5% already shopping. The job is to link your brand to the triggers that send buyers into the market, like a new regulation, a failed project or a board mandate."],
  ask:"What three buying triggers should instantly bring your brand to mind?",terms:["Category entry points","Out-of-market buyers","Mental availability"]},
 {id:"legible",g:1,t:"Legible before preferred",line:"The AI’s answer is the new shelf space. Only a few brands fit on it.",
  body:["Buyers now ask an AI assistant before they ask a vendor. The assistant returns one answer with a handful of names. If the machine can’t describe what you do, the human never gets the chance to prefer you.","The book’s Human-Machine Brand Parity Index asks whether human market understanding and AI-generated descriptions preserve the same category, value, proof, competitive and trust signals. The fix isn’t thousands of pages written for machines. It’s a stable semantic core: consistent language, real proof, credible third parties."],
  ask:"Ask three AI assistants your buyers’ top questions. Do they name you, and do they describe you correctly?",terms:["Answer share","Human-Machine Brand Parity Index","Zero-click search","Generative engine optimization"]},
 {id:"buyer",g:1,t:"The buyer network and the hidden buyer",line:"Six to ten people decide. The ones you never meet often decide no.",
  body:["The buying committee is only the visible part of a wider buyer network. Hidden buyers carry the institutional memory, the risk awareness and the politics the sponsor doesn’t. They know why the last transformation failed. They own the policy or architecture standard that never appears in the RFP.","The Consensus Drag Index gives a structured view of friction inside the network across five dimensions: Role, Goal, Evidence, Risk and Ownership."],
  parts:[["Role","Do the right people know they’re involved?"],["Goal","Are they solving the same problem?"],["Evidence","Does each one have proof that fits their worry?"],["Risk","Whose career is on the line if it fails?"],["Ownership","Who owns the decision after signing?"]],
  ask:"Name the hidden buyer in your biggest open deal. What proof have you given them?",terms:["Hidden buyer","Consensus Drag Index","Buying committee"]},
 {id:"belief",g:1,t:"The Belief-to-Budget Chain",line:"Budget follows belief, one link at a time.",
  body:["The Belief-to-Budget Chain is the sequence of beliefs that turns recognition of a problem into enough economic and political confidence for budget to be allocated.","Decision confidence is built in four layers, each answering a question the buyer is silently asking: Relevance (do they understand our problem?), Proof (have they done something credible enough to reduce our risk?), Consensus (can we align around this choice?) and Safety (can I defend this decision, personally and institutionally?)."],
  parts:[["Relevance","Do they understand our problem?"],["Proof","Can they reduce our risk?"],["Consensus","Can we align internally?"],["Safety","Can I defend this choice?"]],
  ask:"Where in this chain do your deals usually break?",terms:["Decision Confidence","Belief-to-Budget Chain","Decision latency"]},
 {id:"proof",g:2,t:"Proof and trust architecture",line:"Content is no longer scarce. Proof is.",
  body:["Proof Architecture is a deliberate system of customer, outcome, analyst, partner, delivery and leadership evidence that helps buyers validate a claim. Trust Architecture is the repeated, coherent set of signals that makes a company credible across every touchpoint.","Two of the book’s tools keep proof honest. The Proof-to-Risk Ratio compares the strength of available evidence with the consequence the buyer feels. The Proof Freshness Protocol makes sure evidence stays traceable, current, permitted and fit for the claim. Evidence has a shelf life."],
  ask:"Which of your top five claims rests on proof more than 18 months old?",terms:["Proof Architecture","Proof-to-Risk Ratio","Proof Freshness Protocol","Trust Architecture"]},
 {id:"narrative",g:2,t:"Narrative liquidity and signal density",line:"A strong story survives the trip from one room to the next.",
  body:["Narrative Liquidity is the ability of a core story to travel across audiences and channels without losing its meaning. Signal Density is the amount of useful insight, proof, differentiation and consequence a message carries.","Picture a brand deck promising “AI-led transformation at enterprise scale.” Sales shortens it to “we do AI.” A partner slide shrinks it to “digital services.” An AI summary files you beside forty firms that “help enterprises transform.” The Narrative Carry Coefficient measures how much meaning survives that journey."],
  ask:"Ask five colleagues to describe your company in one sentence. How many sound alike?",link:["#/tools/buzz","Test your copy’s signal density"],terms:["Narrative Liquidity","Signal Density","Narrative Carry Coefficient"]},
 {id:"second",g:2,t:"The second sale",line:"The first sale gets you in the door. The second tells you if they’re glad they let you in.",
  body:["The second sale (the renewal, the expansion, the next business unit) is where B2B growth compounds. Delivery creates most of the proof, sales knows the commercial map, and marketing turns proof into memory and advocacy into the warm introduction to the next deal.","Experience Debt is the accumulated gap between the brand’s promise and the experience the organization delivers. It shows up as friction buyers remember long after they forget the tagline."],
  ask:"What does a customer hear from you between the signing and the renewal?",terms:["Experience Debt","Net revenue retention","Land and expand"]},
 {id:"loop",g:3,t:"The signal-to-decision loop",line:"If it can’t answer four questions on one page, it’s information, not intelligence.",
  body:["A practical loop has five moves. Sense a deliberately small set of signals. Interpret: separate noise from pattern and tie it to a business question. Prioritize what needs action now. Activate it as a market response, an account move or a narrative shift. Learn from what changed.","Its output is the intelligence note: a one-page brief that carries a signal from the market to the people who must act on it. It answers what changed, why it matters, the likely consequence and what to do differently."],
  parts:[["Sense","A small, deliberate set of signals"],["Interpret","Noise versus pattern"],["Prioritize","Now, watch, or ignore"],["Activate","Turn insight into a move"],["Learn","Feed the result back in"]],
  ask:"When did a market signal last change a decision in your company?",link:["#/tools/note","Write an intelligence note"],terms:["Intelligence note","Context Fabric"]},
 {id:"shape",g:3,t:"SHAPE: scientific marketing",line:"Treat every campaign as an experiment you can learn from.",
  body:["SHAPE is the authors’ application of scientific reasoning to marketing: Signal, Hypothesize, Act, Prove and Evolve. Signal connects to market sensing. Hypothesize demands human judgment. Act creates discipline. Prove insists on evidence. Evolve keeps the system learning.","Paired with the Learning OS, it turns marketing into an organization that remembers. Thirty minutes a month, four questions: what changed in the market, what did we learn commercially, which experiment is worth repeating, and which habit is worth stopping?"],
  parts:[["Signal","What did we notice?"],["Hypothesize","What do we believe, and why?"],["Act","What will we try?"],["Prove","What evidence would settle it?"],["Evolve","What changes next time?"]],
  ask:"What did your team stop doing last quarter because the evidence said so?",terms:["SHAPE","Learning OS"]},
 {id:"stack",g:3,t:"The measurement stack",line:"Revenue arrives late. Show the board what moves first.",
  body:["Marketing measurement usually jumps from engagement straight to revenue. The book adds the layers in between: Memory, Movement, Confidence and Commercial Outcome. Confidence is the authors’ name for the signals that show whether marketing is actually reducing doubt.","The Value Queue protects capacity by sorting work into what protects value, moves value, builds future value, and what merely consumes attention."],
  parts:[["Memory","Are we known for the right things?"],["Movement","Are target accounts progressing?"],["Confidence","Are we reducing doubt?"],["Commercial outcome","Is it paying back?"]],
  ask:"Which layer of the stack is missing from your board report today?",terms:["Value Queue","Pipeline velocity","Marketing mix modeling"]},
 {id:"rights",g:4,t:"AI decision rights",line:"Before any AI touches a task, decide who gets the last word.",
  body:["The matrix sorts marketing work into four modes. Autonomous: the AI runs, humans audit. Assisted: AI drafts, a human edits. Approved: AI drafts, a named person signs off. Human-led: people decide, AI informs. Generating fifty social variations is autonomous. A customer case study is approved. Crisis response and pricing are human-led.","Two more design rules: give every agent one clear job, and build the Context Fabric (the connected layer of account history, stakeholder roles and current signals) before you build more agents. The Human Judgment Layer is where people stay accountable for ethics, trade-offs and consequences."],
  parts:[["Autonomous","AI runs, humans audit samples"],["Assisted","AI drafts, a human edits"],["Approved","A named person signs off"],["Human-led","People decide, AI informs"]],
  ask:"Which AI use case in your team has no named owner?",terms:["Agentic AI","Context Fabric","Human Judgment Layer"]},
 {id:"fatigue",g:4,t:"AI fatigue and the efficiency ceiling",line:"AI-first. AI-led. AI-native. Tired yet? So are your buyers.",
  body:["Every company now sounds like every other company, as if they found the same thesaurus on the same morning. AI vocabulary has become noise; AI value is what buyers can see for themselves.","The first AI win in marketing is almost always speed. The trap is the efficiency ceiling: the organization simply gets very good at running the old marketing model faster. Cutting a generic campaign from five days to five minutes saves time and gains nothing."],
  ask:"If you removed the word “AI” from your homepage, what would be left to say?",link:["#/tools/buzz","Run the buzzword meter"],terms:["AI washing","Efficiency ceiling"]},
 {id:"bot",g:5,t:"The CMO as a BOT",line:"Brand, Opportunity, Trust: a filter for a crowded agenda.",
  body:["Not bot as in software. Brand asks what the market should remember you for. Opportunity asks where marketing can create or accelerate growth. Trust asks why the market should believe you enough to choose, stay and advocate.","Brand without trust becomes visibility. Opportunity without trust becomes pressure. If a major activity can’t connect to any of the three, it deserves a harder look."],
  parts:[["Brand","Creates memory"],["Opportunity","Creates movement"],["Trust","Makes both durable"]],
  ask:"Which big activity on your plan connects to none of the three?",terms:["CMO as BOT"]},
 {id:"archetypes",g:5,t:"Six CMO archetypes",line:"There’s no best CMO. There’s only the CMO the business needs next.",
  body:["The title may be the same while the center of gravity changes completely: Brand Architect, Growth Operator, Market Shaper, Transformation CMO, Enterprise Steward and Portfolio CMO.","These aren’t job descriptions. Most successful CMOs combine several, and the same person may change archetype as the company grows. A challenger may need a Market Shaper first, a Growth Operator next, and an Enterprise Steward once scale arrives."],
  parts:[["Brand Architect","Identity, relevance, premium perception"],["Growth Operator","Pipeline, conversion, expansion"],["Market Shaper","Influences the category itself"],["Transformation CMO","Rebuilds the engine while the car is moving"],["Enterprise Steward","Reputation and trust at scale"],["Portfolio CMO","Coherence across businesses"]],
  ask:"Which CMO muscle are you building, and which one is missing?",link:["#/play/archetype","Take the archetype quiz"],terms:["CMO archetypes"]},
 {id:"navratnas",g:5,t:"The Nav-Ratnas of a CMO",line:"Akbar kept nine jewels in his court. A great CMO needs a similar set.",
  body:["The nine: a focused financial steward, a consistent innovator, a customer whisperer, a dedicated brand steward, a social media maven, a business strategist, a capable crisis manager, a data analyst, and a customer advocate and motivator.","A well-rounded CMO doesn’t need to be the best at every jewel, but does need to know when each one matters."],
  ask:"Which jewel would your CEO say you’re missing?",terms:["Nav-Ratnas"]},
 {id:"maturity",g:5,t:"Five stages of brand maturity",line:"Each stage has a different job. Copying the wrong one is expensive.",
  body:["Unknown: earn clarity, visibility and just enough believable proof. Emerging: repetition with meaning. Say one clear thing many times in many credible rooms. Challenger: change the question the buyer is asking. Trusted: make the buyer feel safe, because in B2B safety is premium. Category-shaping: teach the market how to think and turn influence into gravity.","‘Best practice’ is often stage-specific practice wearing a universal label."],
  parts:[["Unknown","Clarity first"],["Emerging","Repetition with meaning"],["Challenger","Change the question"],["Trusted","Make buyers feel safe"],["Category-shaping","Teach the market"]],
  ask:"Which stage is your brand really in, and which stage’s playbook are you running?",terms:["Category design","Positioning"]},
 {id:"marketer",g:5,t:"The modern marketer: Ganesha and Suryanamaskar",line:"Listen deeply, think laterally, feel immensely.",
  body:["The book borrows Ganesha as an anatomy of the modern marketer: big ears for empathy, small eyes for focus, a long trunk for reach, a resilient tusk for grit, and a large belly for wisdom that digests and builds energy. It pairs this with six fluencies: business, market, narrative, analytical, AI and human.","Brand building, it argues, is less like a campaign and more like a Suryanamaskar: twelve movements practiced daily until they become muscle memory. They run from learn to fail, build, push, disrupt, question and unlearn, through enjoy, excel, be aggressive, leap and stay agile, to learn to win."],
  ask:"Which of the six fluencies is weakest in your team?",terms:["T-shaped marketer","Cognitive athlete"]},
 {id:"krishna",g:5,t:"Krishna and Vivekananda: story as strategy",line:"Same core, different voices. Earn attention before asking for agreement.",
  body:["To Arjuna, frozen on the battlefield, Krishna speaks as a teacher. To Duryodhana’s court he arrives as a peace envoy. In Vrindavan he is the playful cowherd with a flute. Same Krishna, same core, three different voices: context as a marketing discipline.","Swami Vivekananda’s Chicago address shows how a story crosses geography when it carries something larger than geography. International credibility isn’t created by hiding where a brand comes from. For India-born brands selling to the world, that’s the whole lesson."],
  ask:"Does your brand change its voice for each room without changing its core?",terms:["Born in the East, built for the world"]}
];

  mount(){

    const arc = (a0,a1,r) => { const p = a => [200 + r*Math.sin(a), 200 - r*Math.cos(a)]; const [x0,y0]=p(a0),[x1,y1]=p(a1); return `M${x0.toFixed(1)},${y0.toFixed(1)} A${r},${r} 0 0 1 ${x1.toFixed(1)},${y1.toFixed(1)}`; };

      <circle class="ring" cx="200" cy="200" r="170"/>
      ${spokes}
      <path class="loop" marker-end="url(#ah)" d="${arc(d2r(26),d2r(94),78)}"/>
      <path class="loop" marker-end="url(#ah)" d="${arc(d2r(146),d2r(214),78)}"/>
      <path class="loop" marker-end="url(#ah)" d="${arc(d2r(266),d2r(334),78)}"/>

    function pick(i){

function decoder(params){
  return {html:`
  <div class="wrap">
    <div class="page-head"><h2>The Decoder <span class="serif">Jargon, meet plain English.</span></h2><p class="lede">Every concept from the book and the industry terms around it. Start typing.</p></div>
    <div class="search">
      <label class="sr" for="q">Search terms</label>
      <input id="q" type="search" placeholder="Try “hidden buyer”, “ABM” or “proof”" autocomplete="off" value="${esc(params.q||'')}">
      <div class="seg" role="group" aria-label="Filter by source">
        <button data-f="all" aria-pressed="true">All</button><button data-f="book" aria-pressed="false">From the book</button><button data-f="ind" aria-pressed="false">Industry</button>
      </div>
      <button class="btn" id="rand">Surprise me</button>
    </div>
    <div class="az" id="az" role="group" aria-label="Jump to letter"></div>
    <p class="count" id="count" aria-live="polite"></p>
    <dl class="terms" id="terms"></dl>
  </div>`,
  mount(){
    let filter='all', letter='', flash='';
    const q=$('#q'), list=$('#terms');
    const sorted = TERMS.slice().sort((a,b)=>a[0].localeCompare(b[0]));
    const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
    const has = new Set(sorted.map(t=>t[0].replace(/^The /,'')[0].toUpperCase()));
    $('#az').innerHTML = `<button data-l="" aria-pressed="true">All</button>` + letters.map(l=>`<button data-l="${l}" aria-pressed="false" ${has.has(l)?'':'disabled'}>${l}</button>`).join('');
    const hl = (s, term) => { if(!term) return esc(s); const i = s.toLowerCase().indexOf(term.toLowerCase()); if(i<0) return esc(s); return esc(s.slice(0,i))+'<mark>'+esc(s.slice(i,i+term.length))+'</mark>'+esc(s.slice(i+term.length)); };
    function draw(){
      const term = q.value.trim();
      const tl = term.toLowerCase();
      const res = sorted.filter(t => (filter==='all'||t[1]===filter) && (!letter || t[0].replace(/^The /,'')[0].toUpperCase()===letter) && (!tl || t[0].toLowerCase().includes(tl) || t[2].toLowerCase().includes(tl)))
        .sort((a,b)=> tl ? (b[0].toLowerCase().includes(tl)) - (a[0].toLowerCase().includes(tl)) : 0);
      $('#count').textContent = res.length ? `${res.length} term${res.length>1?'s':''}` : '';
      list.innerHTML = res.length ? res.map(t=>`<li class="${t[0]===flash?'flash':''}" id="t-${encodeURIComponent(t[0])}"><dt><span class="tn">${hl(t[0],term)}</span> <span class="tag ${t[1]==='book'?'book':''}">${t[1]==='book'?'From the book':'Industry'}</span></dt><dd>${hl(t[2],term)}${t[3]?` <a href="#/concepts/${t[3]}">Read the concept</a>`:''}</dd></li>`).join('')
        : `<div class="empty">No term matches “${esc(term)}”. Try a shorter word, or clear the letter filter.</div>`;
    }
    q.addEventListener('input', ()=>{ flash=''; draw(); });
    $$('.seg button').forEach(b=>b.addEventListener('click',()=>{ filter=b.dataset.f; $$('.seg button').forEach(x=>x.setAttribute('aria-pressed',x===b)); draw(); }));
    $('#az').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b||b.disabled) return; letter=b.dataset.l; $$('#az button').forEach(x=>x.setAttribute('aria-pressed',x===b)); draw(); });
    $('#rand').addEventListener('click',()=>{ const t=TERMS[Math.floor(Math.random()*TERMS.length)]; q.value=''; letter=''; filter='all'; $$('#az button').forEach((x,i)=>x.setAttribute('aria-pressed',i===0)); $$('.seg button').forEach((x,i)=>x.setAttribute('aria-pressed',i===0)); flash=t[0]; draw(); const el=document.getElementById('t-'+encodeURIComponent(t[0])); if(el) el.scrollIntoView({block:'center',behavior:'smooth'}); });
    draw(); if(!params.q) q.focus({preventScroll:true});
  }};
}

/* --- Five Notes --- */
function fivenotes(params){
  const practice = params.mode==='practice';
  return {html:`
  <div class="wrap">
    <a class="back" href="#/play">Back to games</a>
    <div class="page-head" style="padding-top:20px"><h2>Five Notes</h2><p class="lede" id="fnClue"></p></div>
    <div class="fn">
      <div>
        <div class="grid5" id="grid" aria-label="Guess grid"></div>
        <p class="msg" id="msg" aria-live="polite"></p>
        <div class="kbd" id="kbd"></div>
      </div>
      <aside class="side-card">
        <h4>${practice?'Practice round':'Today’s word'}</h4>
        <p>Orange: right letter, right place. Teal: right letter, wrong place. Gray: not in the word.</p>
        <div class="stats" id="stats"></div>
        <div id="after"></div>
        <p style="margin-top:12px"><a href="#/play/fivenotes?mode=${practice?'daily':'practice'}">${practice?'Back to today’s word':'Play a practice round'}</a></p>
      </aside>
    </div>
  </div>`,
  mount(){
    const pick = practice ? WORDS[Math.floor(Math.random()*WORDS.length)] : WORDS[dayIndex() % WORDS.length];
    const target = pick[0];
    $('#fnClue').textContent = 'Clue: ' + pick[1];
    const saved = !practice ? store.get('fn:day',null) : null;
    let guesses = (saved && saved.d===todayKey()) ? saved.g : [];
    let cur = '', done = false;
    const grid=$('#grid'), kbd=$('#kbd');
    const rows = ['QWERTYUIOP','ASDFGHJKL','+ZXCVBNM-'];
    kbd.innerHTML = rows.map(r=>`<div>${r.split('').map(k=> k==='+'?`<button class="wide" data-k="Enter">Enter</button>`: k==='-'?`<button class="wide" data-k="Backspace" aria-label="Delete">Del</button>`:`<button data-k="${k}">${k}</button>`).join('')}</div>`).join('');
    function score(g){ const res=Array(5).fill('miss'), t=target.split(''), used=Array(5).fill(false);
      for(let i=0;i<5;i++) if(g[i]===t[i]){res[i]='hit';used[i]=true;}
      for(let i=0;i<5;i++) if(res[i]!=='hit'){ const j=t.findIndex((c,k)=>c===g[i]&&!used[k]); if(j>-1){res[i]='near';used[j]=true;} }
      return res; }
    function drawStats(){ const s=store.get('fn:stats',{played:0,wins:0,streak:0}); $('#stats').innerHTML=`<div><b>${s.played}</b><span>Played</span></div><div><b>${s.played?Math.round(100*s.wins/s.played):0}%</b><span>Won</span></div><div><b>${s.streak}</b><span>Streak</span></div>`; }
    function draw(){
      let h='';
      for(let r=0;r<6;r++){
        const g = guesses[r] || (r===guesses.length ? cur : '');
        const sc = guesses[r] ? score(guesses[r]) : null;
        h += `<div class="row5" data-r="${r}">`;
        for(let c=0;c<5;c++){ const ch=g[c]||''; h += `<div class="tile ${ch?'filled':''} ${sc?sc[c]:''}" aria-label="${ch?ch+(sc?' '+({hit:'correct',near:'wrong place',miss:'absent'})[sc[c]]:''):'empty'}">${ch}</div>`; }
        h += '</div>';
      }
      grid.innerHTML = h;
      const best = {};
      guesses.forEach(g=>{ const sc=score(g); g.split('').forEach((ch,i)=>{ const rank={miss:1,near:2,hit:3}; if(!best[ch]||rank[sc[i]]>rank[best[ch]]) best[ch]=sc[i]; }); });
      $$('#kbd button').forEach(b=>{ b.className = (b.classList.contains('wide')?'wide ':'') + (best[b.dataset.k]||''); });
    }
    function finish(win, fresh){
      done = true;
      $('#msg').textContent = win ? ['Maestro!','Brilliant.','Well conducted.','Nicely done.','Close call.','Phew.'][guesses.length-1] : `The word was ${target}.`;
      if(fresh && !practice){ const s=store.get('fn:stats',{played:0,wins:0,streak:0}); s.played++; if(win){s.wins++;s.streak++;}else s.streak=0; store.set('fn:stats',s); }
      drawStats();
      const grid = guesses.map(g=>score(g).map(x=>({hit:'🟧',near:'🟦',miss:'⬜'})[x]).join('')).join('\n');
      const share = `Five Notes ${practice?'(practice)':'#'+(dayIndex()+1)} ${win?guesses.length:'X'}/6\n${grid}\nThe AIviSIble Orchestra`;
      $('#after').innerHTML = `<div class="result-card"><p><b>${target}</b>: ${esc(pick[1])}</p><button class="btn primary" id="shareBtn">Copy result</button></div>`;
      $('#shareBtn').addEventListener('click',()=>copy(share));
    }
    function submit(){
      if(cur.length<5){ $('#msg').textContent='Five letters, please.'; const row=$(`.row5[data-r="${guesses.length}"]`); row&&row.classList.add('shake'); setTimeout(()=>row&&row.classList.remove('shake'),400); return; }
      guesses.push(cur); cur='';
      if(!practice) store.set('fn:day',{d:todayKey(),g:guesses});
      draw();
      if(guesses.at(-1)===target) finish(true,true); else if(guesses.length===6) finish(false,true); else $('#msg').textContent='';
    }
    function key(k){
      if(done) return;
      if(k==='Enter') return submit();
      if(k==='Backspace'){ cur=cur.slice(0,-1); return draw(); }
      if(/^[A-Z]$/.test(k) && cur.length<5){ cur+=k; draw(); }
    }
    kbd.addEventListener('click',e=>{ const b=e.target.closest('button'); if(b) key(b.dataset.k); });
    const onKey = e => { if(e.ctrlKey||e.metaKey||e.altKey) return; const k = e.key.length===1 ? e.key.toUpperCase() : e.key; if(k==='Enter'||k==='Backspace'||/^[A-Z]$/.test(k)){ e.preventDefault(); key(k); } };
    document.addEventListener('keydown', onKey);
    cleanup = () => document.removeEventListener('keydown', onKey);
    draw(); drawStats();
    if(guesses.length && (guesses.at(-1)===target || guesses.length===6)) finish(guesses.at(-1)===target,false);
  }};
}

function dealdrop(){
  const STAGES = ["Shortlisted","Discovery call","Proposal sent","Security review","Procurement","No decision","Closed lost"];
  return {html:`
  <div class="wrap">
    <a class="back" href="#/play">Back to games</a>
    <div class="page-head" style="padding-top:20px"><h2>Deal Drop</h2><p class="lede">Guess the concept before the deal slips away. Six wrong letters and it’s closed lost.</p></div>
    <div class="dd">
      <div>
        <p class="clue" id="clue"></p>
        <div class="phrase" id="phrase" aria-live="polite"></div>
        <div class="letters" id="letters"></div>
        <p class="msg" id="ddmsg" aria-live="polite"></p>
        <div id="ddnext"></div>
      </div>
      <aside><h4 style="margin:0 0 12px">Your deal</h4><ol class="pipe" id="pipe">${STAGES.map(s=>`<li>${s}</li>`).join('')}</ol><p style="font-size:15px;color:var(--ink-2);margin-top:16px">Deals won: <b id="ddwins">${store.get('dd:wins',0)}</b></p></aside>
    </div>
  </div>`,
  mount(){
    let order = shuffle(PHRASES), pi = 0, guessed, miss, over;
    function start(){
      const [ph, clue] = order[pi % order.length]; pi++;
      guessed = new Set(); miss = 0; over = false;
      $('#clue').textContent = clue; $('#ddmsg').textContent=''; $('#ddnext').innerHTML='';
      $('#letters').innerHTML = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(l=>`<button data-l="${l}" aria-label="Guess ${l}">${l}</button>`).join('');
      start.ph = ph; draw();
    }
    function draw(reveal){
      const ph = start.ph;
      $('#phrase').innerHTML = ph.split(' ').map(w=>`<div class="word">${w.split('').map(ch=>`<div class="slot ${reveal&&!guessed.has(ch)?'reveal':''}">${guessed.has(ch)||reveal?ch:''}</div>`).join('')}</div>`).join('');
      $$('#pipe li').forEach((li,i)=>{ li.className = i===Math.min(miss,6) ? (miss>=6?'lost here':'here') : ''; });
    }
    function guess(l){
      if(over || guessed.has(l)) return;
      guessed.add(l);
      const b = $(`#letters button[data-l="${l}"]`); b.disabled = true;
      if(start.ph.includes(l)) b.classList.add('ok'); else miss++;
      const won = start.ph.replace(/ /g,'').split('').every(c=>guessed.has(c));
      if(won){ over=true; const w=store.get('dd:wins',0)+1; store.set('dd:wins',w); $('#ddwins').textContent=w; $('#ddmsg').textContent = miss===0 ? 'Signed without a single objection.' : 'Deal signed.'; }
      else if(miss>=6){ over=true; $('#ddmsg').textContent='Closed lost. Here’s what it was.'; draw(true); }
      if(over){ $('#ddnext').innerHTML = `<button class="btn primary" id="again">Next deal</button>`; $('#again').addEventListener('click',start); $('#again').focus(); }
      if(miss<6) draw();
    }
    $('#letters').addEventListener('click',e=>{ const b=e.target.closest('button'); if(b) guess(b.dataset.l); });
    const onKey = e => { if(e.ctrlKey||e.metaKey||e.altKey) return; const k=e.key.toUpperCase(); if(/^[A-Z]$/.test(k)){ guess(k); } };
    document.addEventListener('keydown', onKey);
    cleanup = () => document.removeEventListener('keydown', onKey);
    start();
  }};
}

function match(){

      let open=[], moves=0, found=0, lock=false;
      $('#mgrid').innerHTML = cards.map((c,i)=>`<button class="mcard" data-i="${i}" aria-label="Hidden card"><div class="in"><div class="face front">♪</div><div class="face backf ${c.term?'term':''}">${esc(c.txt)}</div></div></button>`).join('');
      $('#mmsg').textContent=''; $('#mnext').innerHTML=''; $('#mstat').textContent='Moves: 0';
      $('#mgrid').onclick = e => {

        if(open.length===2){
          moves++; $('#mstat').textContent='Moves: '+moves;
          const [a,c] = open.map(x=>cards[x.dataset.i]);
          if(a.id===c.id && a.term!==c.term){ open.forEach(x=>{x.classList.remove('up');x.classList.add('done');}); open=[]; found++;
            if(found===6){ const best=store.get('m:best',null); const nb = best===null||moves<best; if(nb) store.set('m:best',moves); $('#mmsg').textContent=`All six matched in ${moves} moves.${nb?' New personal best.':' Best: '+best+'.'}`; $('#mnext').innerHTML='<button class="btn primary" id="mag">Deal a new set</button>'; $('#mag').onclick=start; } }

        }
      };
    }
    start();
  }};
}

  const lines = h.split(/\n/); let out='', inList=false;
  for(const ln of lines){
    const m = ln.match(/^\s*[-*]\s+(.*)/);
    if(m){ if(!inList){ out+='<ul>'; inList=true; } out+='<li>'+m[1]+'</li>'; continue; }
    if(inList){ out+='</ul>'; inList=false; }
    if(ln.trim()) out+='<p>'+ln+'</p>';
  }
  if(inList) out+='</ul>';
  return out;
}
function ganesha(){
  return {html:`
  <div class="wrap">
    <div class="page-head"><h2>Ask Ganesha <span class="serif">Remover of obstacles. Reader of the book.</span></h2><p class="lede">Stuck on a concept, a strategy or your next career move? Ask, and get a calm, clear answer drawn from the book’s ideas.</p></div>
    <div class="gx">
      <aside class="gx-side">
        <div class="gx-art">${GANESHA_SVG}</div>
        <h3>The marketer’s anatomy</h3>
        <ul class="gx-lessons">${GANESHA_LESSONS.map(l=>`<li><b>${l[0]}</b><span>${l[1]}</span></li>`).join('')}</ul>
      </aside>
      <section class="gx-chat" aria-label="Chat with Ganesha">
        <div class="gx-log" id="gxLog" aria-live="polite">
          <div class="gmsg g"><div class="who">Ganesha</div><p>Welcome. Every beginning deserves a clear path. Ask me anything about the book, B2B marketing, or the road ahead in your career, and we’ll remove an obstacle or two together.</p></div>
        </div>
        <div class="gx-starters" id="gxStarters">${GANESHA_STARTERS.map(q=>`<button class="pill-link" data-q="${esc(q)}">${esc(q)}</button>`).join('')}</div>
        <form class="gx-form" id="gxForm" autocomplete="off">
          <label class="sr" for="gxIn">Your question</label>
          <textarea id="gxIn" rows="2" placeholder="Ask about a concept, a strategy or your career" maxlength="800"></textarea>
          <div class="gx-actions">
            <button type="button" class="btn" id="gxNew">New chat</button>
            <button type="button" class="btn" id="gxStop" hidden>Stop</button>
            <button type="submit" class="cta" id="gxSend">Ask ${CHEV}</button>
          </div>
        </form>
        <p class="gx-note" id="gxNote">Answers are generated by AI from the book’s ideas, offered as a playful guide and with respect. Check anything important before you act on it.</p>
      </section>
    </div>
  </div>`,
  async mount(){
    const log=$('#gxLog'), form=$('#gxForm'), input=$('#gxIn'), send=$('#gxSend'), stop=$('#gxStop');
    let history=[], ctl=null, alive=true;
    cleanup = () => { alive=false; if(ctl) ctl.abort(); };
    const notes = ganeshaNotes();
    const errCopy = {
      not_granted:"You chose not to let this page use Claude, so I can’t answer here. Reload the page if you’d like to allow it.",
      rate_limited:"Many questions at once. Give it a moment, then ask again.",
      queue_overflow:"Many questions at once. Give it a moment, then ask again.",
      prompt_too_large:"Our conversation has grown long. Start a new chat and ask again.",
      refused:"That’s one obstacle I can’t remove. Try a question about marketing, the book or your career.",
      session_expired:"Your session has expired. Reload the page and sign in again.",
      cancelled:"Stopped."
    };
    function add(role, html){ const d=document.createElement('div'); d.className='gmsg '+(role==='g'?'g':'u'); d.innerHTML=(role==='g'?'<div class="who">Ganesha</div>':'')+html; log.appendChild(d); log.scrollTop=log.scrollHeight; return d; }
    function offline(){
      $('#gxStarters').hidden = true; form.hidden = true;
      $('#gxNote').textContent = 'Ask Ganesha answers when this page is opened inside Claude. Until then, here is one lesson to carry with you.';
      const l = GANESHA_LESSONS[dayIndex() % GANESHA_LESSONS.length];
      add('g', `<p><b>${l[0]}.</b> ${esc(l[1])}</p>`);
    }
    let sample = null;
    try { sample = window.claude && window.claude.use ? await window.claude.use('sample') : null; } catch(e){ sample = null; }
    if(!alive) return;
    if(!sample){ offline(); return; }
    function prompt(q){
      const convo = history.slice(-8).map(m=>(m.role==='user'?'Reader: ':'Ganesha: ')+m.content).join('\n');
      return `You are "Ask Ganesha", a gentle, wise guide on the reader companion site for the book The AIviSIble Orchestra by Sairam Vedam and Prasant Agarwal. Speak in the warm, calm, first-person voice of Lord Ganesha, remover of obstacles and patron of new beginnings and wisdom, as the book uses him: a metaphor for the modern marketer (big ears to listen, small eyes to focus, a long trunk for reach, one tusk for grit, a large belly that digests knowledge).
Rules:
- Be respectful and dignified. Never joke about faith, never make religious pronouncements, predictions or promises of blessings. If asked about religion, scripture or rituals, kindly say you are here to help with marketing, the book and careers.
- Help with B2B marketing, the book's ideas and marketing careers. For unrelated requests, gently steer back.
- Ground answers in the BOOK NOTES. If the notes do not cover something, say so briefly and offer sensible general guidance, clearly as your own view.
- Never invent quotes, statistics, page numbers, chapter numbers or facts about the authors.
- Style: American English, plain words, 60 to 160 words, short paragraphs, at most one Ganesha metaphor, no em dashes, no headings. Use **bold** sparingly; a short "- " list only when it truly helps.
- If one book concept fits the answer, end with a final line exactly like [[concept:ID]] using an ID from the notes. Otherwise leave it out.

BOOK NOTES (ID: title: summary)
${notes.c}

GLOSSARY
${notes.t}

${convo?'CONVERSATION SO FAR\n'+convo+'\n\n':''}Reader: ${q}
Ganesha:`;
    }
    function render(el, text){
      const m = text.match(/\[\[concept:([a-z0-9-]+)\]\]\s*$/i);
      let body = text.replace(/\[\[concept:[^\]]*\]\]?\s*$/i,'').replace(/\[\[[^\]]*$/,'').replace(/\u2014/g,', ');
      let html = '<div class="who">Ganesha</div>'+mdLite(body.trim());
      if(m){ const c = CONCEPTS.find(x=>x.id===m[1].toLowerCase()); if(c) html += `<p class="gx-rel">Read the concept: <a href="#/concepts/${c.id}">${esc(c.t)}</a></p>`; }
      el.innerHTML = html; log.scrollTop = log.scrollHeight;
    }
    async function ask(q){
      q = q.trim(); if(!q || ctl) return;
      $('#gxStarters').hidden = true;
      add('u', `<p>${esc(q)}</p>`); input.value='';
      const el = add('g', '<div class="who">Ganesha</div><p class="gx-think">Thinking<span>.</span><span>.</span><span>.</span></p>');
      ctl = new AbortController(); send.disabled=true; stop.hidden=false;
      try{
        const {text} = await sample(prompt(q), {modelTier:'quick', cache:false, signal:ctl.signal, onText:({text})=>render(el,text)});
        render(el, text);
        history.push({role:'user',content:q},{role:'assistant',content:text.replace(/\[\[concept:[^\]]*\]\]\s*$/i,'').trim()});
      }catch(e){
        const keep = e && e.text ? e.text : '';
        if(keep && e.code==='cancelled'){ render(el, keep); }
        else el.innerHTML = '<div class="who">Ganesha</div><p>'+esc(errCopy[e&&e.code] || 'I couldn’t reach Claude just now. Try again in a moment.')+'</p>';
        if(e && e.code==='not_granted'){ form.hidden=true; $('#gxStarters').hidden=true; }
      }finally{
        ctl=null; send.disabled=false; stop.hidden=true; if(alive && !form.hidden) input.focus();
      }
    }
    form.addEventListener('submit', e=>{ e.preventDefault(); ask(input.value); });
    input.addEventListener('keydown', e=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); ask(input.value); } });
    $('#gxStarters').addEventListener('click', e=>{ const b=e.target.closest('button'); if(b) ask(b.dataset.q); });
    stop.addEventListener('click', ()=>{ if(ctl) ctl.abort(); });
    $('#gxNew').addEventListener('click', ()=>{ if(ctl) ctl.abort(); history=[]; log.innerHTML=''; add('g','<p>A fresh start, my favorite kind. What would you like to ask?</p>'); $('#gxStarters').hidden=false; input.focus(); });
  }};
}

/* ============ ROUTER ============ */
function parse(){
  const h = location.hash.replace(/^#\/?/,'').split('#')[0];
  const [path, qs] = h.split('?');
  const params = Object.fromEntries(new URLSearchParams(qs||''));
  const parts = path.split('/').filter(Boolean);
  return {parts, params};
}
function render(){
  if(cleanup){ try{cleanup();}catch(e){} cleanup=null; }
  const {parts, params} = parse();
  const top = parts[0] || '';
  let view;
  if(top==='concepts') view = concepts(parts[1]);
  else if(top==='decoder') view = decoder(params);
  else if(top==='play'){
    const g = parts[1];
    view = g==='fivenotes' ? fivenotes(params) : g==='dealdrop' ? dealdrop() : g==='match' ? match() : g==='archetype' ? archetype() : g==='scramble' ? scramble() : play();
  }
  else if(top==='tools') view = tools(parts[1]);
  else if(top==='authors') view = authors();
  else if(top==='ganesha') view = ganesha();
  else if(top==='prebook') view = prebook();
  else view = home();
  const main = $('#main');
  const pageNames = {concepts:'Concepts',decoder:'The Decoder',play:'Play',tools:'Tools',authors:'The authors',ganesha:'Ask Ganesha'};
  const rh = pageNames[top] ? `<div class="wrap runhead"><span>The AIviSIble Orchestra | Reader companion</span><span>${pageNames[top]}</span></div>` : '';
  main.innerHTML = rh + view.html;
  $$('nav.main a').forEach(a=>a.setAttribute('aria-current', a.dataset.nav===top ? 'page' : 'false'));
  $('.top-cta').setAttribute('aria-current', top==='prebook' ? 'page' : 'false');
  const titles = {'':'Home',concepts:'Concepts',decoder:'The Decoder',play:'Play',tools:'Tools',authors:'Authors',ganesha:'Ask Ganesha',prebook:'Pre-book'};
  document.title = (titles[top]||'Home') + ' · The AIviSIble Orchestra';
  if(view.mount) view.mount();
  if(!(top==='concepts' && parts[1] && window.innerWidth>900)) window.scrollTo(0,0);
  else { const t=$('#cTitle'); t && t.focus({preventScroll:true}); window.scrollTo(0,0); }
  const frag = location.hash.split('#')[2];
  if(frag){ const el=document.getElementById(frag); if(el) setTimeout(()=>el.scrollIntoView({block:'start'}),30); }
}
window.addEventListener('hashchange', render);

/* theme */
(function(){
  const saved = store.get('theme',null);
  if(saved) document.documentElement.setAttribute('data-theme', saved);
  $('#themeBtn').addEventListener('click',()=>{
    const cur = document.documentElement.getAttribute('data-theme') || 'light';
    const n = cur==='dark'?'light':'dark';
    document.documentElement.setAttribute('data-theme', n); store.set('theme', n);
  });
})();
render();
</script>
<script>
/* keep the current page's menu link in view on narrow screens */
(function(){
  function centre(){
    var n=document.querySelector('nav.main'); if(!n||n.scrollWidth<=n.clientWidth) return;
    var a=n.querySelector('a[aria-current="page"]'); if(!a) return;
    var nr=n.getBoundingClientRect(), ar=a.getBoundingClientRect();
    var left=n.scrollLeft+(ar.left-nr.left)-(n.clientWidth-ar.width)/2;
    var calm=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    try{n.scrollTo({left:Math.max(0,left),behavior:calm?'auto':'smooth'})}catch(e){n.scrollLeft=Math.max(0,left)}
  }
  window.addEventListener('hashchange',function(){setTimeout(centre,80)});
  window.addEventListener('load',function(){setTimeout(centre,80)});
})();
</script>
